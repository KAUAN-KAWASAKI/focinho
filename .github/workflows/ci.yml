name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Os testes usam H2 em memória (perfil "test"), então não precisam de MySQL nem de senha.
      - name: Compilar e rodar os testes
        run: ./mvnw -B verify
