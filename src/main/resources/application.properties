spring.application.name=focinho
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/focinhodb?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

focinho.fuso=America/Sao_Paulo
focinho.funcionamento.abertura=08:00
focinho.funcionamento.fechamento=18:00
focinho.funcionamento.dias=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY

# Deploy (Render): a porta vem da plataforma; atrás do proxy dela, o app precisa
# confiar nos cabeçalhos X-Forwarded-* para saber que a conexão original é HTTPS.
server.port=${PORT:8080}
server.forward-headers-strategy=native
spring.jpa.open-in-view=false
